name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app and extension
        run: xcodebuild -project Groot.xcodeproj -scheme Groot -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Groot.app Payload/
          ditto -c -k --keepParent Payload Groot.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Groot-ipa
          path: Groot.ipa
          if-no-files-found: error
          retention-days: 14
